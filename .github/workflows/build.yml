name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests (:flaglens)
        run: ./gradlew :flaglens:testDebugUnitTest --console=plain

      - name: Lint (:flaglens)
        run: ./gradlew :flaglens:lintDebug --console=plain

      - name: Assemble library
        run: ./gradlew :flaglens:assembleDebug --console=plain

      - name: Assemble sample app
        run: ./gradlew :sample:assembleDebug --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            flaglens/build/reports/tests
            flaglens/build/reports/lint-results-debug.html
          retention-days: 7
